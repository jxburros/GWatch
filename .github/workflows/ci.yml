name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  # Formatting, vetting and module hygiene. Fast, so it fails first.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go mod tidy is up to date
        run: |
          cp go.mod go.mod.orig
          cp go.sum go.sum.orig
          go mod tidy
          if ! diff -q go.mod go.mod.orig >/dev/null || ! diff -q go.sum go.sum.orig >/dev/null; then
            echo "::error::go.mod/go.sum are out of date. Run 'go mod tidy' and commit the result."
            diff -u go.mod.orig go.mod || true
            diff -u go.sum.orig go.sum || true
            exit 1
          fi

      - name: Modules verify
        run: go mod verify

  # The test suite runs on both platforms GWatch ships on: it installs as a
  # Windows service and as a plain binary on Linux.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      # The race detector needs cgo, which is only reliably available on the
      # Linux runner; Windows runs the same suite without it.
      - name: Test (race + coverage)
        if: runner.os == 'Linux'
        run: go test -race -covermode=atomic -coverprofile=coverage.out -count=1 ./...

      - name: Test
        if: runner.os != 'Linux'
        run: go test -count=1 ./...

      - name: Coverage summary
        if: runner.os == 'Linux'
        run: |
          go tool cover -func=coverage.out | tee coverage.txt
          {
            echo '### Coverage'
            echo '```'
            tail -n 20 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.out
            coverage.txt
          if-no-files-found: error

  # The web UI is embedded into the binary with //go:embed, so a syntax error
  # in an asset is invisible to the Go compiler and only shows up as a blank
  # page at runtime.
  web:
    name: Web assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax check
        run: |
          status=0
          while IFS= read -r f; do
            if ! node --check "$f"; then
              echo "::error file=$f::JavaScript syntax error"
              status=1
            fi
          done < <(find web -name '*.js' -type f | sort)
          exit $status

      - name: Entry points exist
        run: |
          status=0
          for f in web/index.html web/app.js web/app.css web/api.js web/components.js; do
            if [ ! -s "$f" ]; then
              echo "::error::missing or empty web asset: $f"
              status=1
            fi
          done
          exit $status

  # The release artefacts must keep cross-compiling, including the CGO-free
  # SQLite build used for the single-file Windows executable.
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          out="dist/gwatch-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then out="$out.exe"; fi
          go build -trimpath -ldflags "-s -w -X main.version=ci-${GITHUB_SHA::7}" -o "$out" .
          ls -lh "$out"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: gwatch-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  # install.ps1 / uninstall.ps1 are how GWatch gets onto a Windows machine, so
  # a syntax error there breaks setup even when the binary is fine.
  scripts:
    name: PowerShell scripts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem -Path scripts -Filter *.ps1 -Recurse) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              $failed = $true
              foreach ($e in $errors) {
                Write-Host "::error file=$($file.FullName)::$($e.Message)"
              }
            } else {
              Write-Host "ok $($file.Name)"
            }
          }
          if ($failed) { exit 1 }
