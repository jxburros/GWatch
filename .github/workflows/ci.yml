name: CI

# The Windows job does everything GWatch needs on the platform it ships on as
# a service: lint, build, test, web-asset checks, PowerShell script parsing
# and the two Inno Setup installers. Linux and macOS get their own jobs below
# — lighter, since neither builds an installer — so that a platform-specific
# regression (a build tag, a syscall, sysmetrics' darwin/linux paths) is
# caught before it reaches a tag push (see the `release` job for the
# cross-compiled artefacts).

on:
  push:
    branches: ['**']
    # v* triggers the core release job below. agent-v* is the hardware
    # agent's own tag scheme and triggers the agent-release job: the agent
    # versions and releases on its own so that a fix for it does not need a
    # GWatch release, and so that agents can update themselves from releases
    # that carry nothing else (docs/RELEASING.md#releasing-the-agent).
    # mcp/v* is the MCP companion's own tag scheme (nested-module tags, so
    # `go install .../mcp/...@latest` resolves) and triggers only the mcp-tag
    # guard job, not a second release.
    tags: ['v*', 'agent-v*', 'mcp/v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  ci:
    name: Lint, build, test (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # Windows git defaults to CRLF conversion, which makes gofmt and the
      # go.mod diff report every file as changed.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      # The newest 1.26 patch rather than go.mod's `go 1.26.0`: a
      # go-version-file install would pin the .0 release, and every stdlib
      # fix since would then show up as a govulncheck failure until someone
      # bumped the directive. Tracking the patch level here keeps the scan
      # honest and the builds on a supported toolchain.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: gofmt, go vet, go mod tidy, go mod verify
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd:"; echo "$unformatted"; gofmt -d .; exit 1
          fi
          go vet ./...
          cp go.mod go.mod.orig && cp go.sum go.sum.orig
          go mod tidy
          if ! diff -q go.mod go.mod.orig >/dev/null || ! diff -q go.sum go.sum.orig >/dev/null; then
            echo "::error::go.mod/go.sum are out of date. Run 'go mod tidy' and commit the result."
            diff -u go.mod.orig go.mod || true; diff -u go.sum.orig go.sum || true; exit 1
          fi
          rm -f go.mod.orig go.sum.orig
          go mod verify

      - name: Build and test
        run: |
          go build ./...
          go test -count=1 ./...

      # The MCP companion (ROADMAP 3.1/3.2) is its own Go module with its own
      # go.mod and its own version. It is not covered by the root ./... above —
      # a nested module is invisible to the parent's package patterns — so it
      # gets its own gofmt/vet/test/build here. It must keep building with
      # the toolchain set up above: GOTOOLCHAIN=local means an SDK release
      # requiring a newer Go would fail here rather than silently download
      # a toolchain.
      - name: MCP companion — gofmt, go vet, go test
        working-directory: mcp
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files in mcp/ are not gofmt'd:"; echo "$unformatted"; gofmt -d .; exit 1
          fi
          go mod verify
          go vet ./...
          go test -count=1 ./...
      - name: MCP companion — build
        working-directory: mcp
        run: go build ./...

      # The .syso resource objects are committed, not built at release time, so
      # they can silently fall out of step with the icon they came from.
      # Regenerating is deterministic, so a diff here means one was forgotten.
      - name: Windows icon resources are up to date
        run: |
          go run ./cmd/gwatch-rsrc -ico scripts/installer/assets/gwatch.ico -out rsrc
          go run ./cmd/gwatch-rsrc -ico scripts/installer/assets/gwatch.ico -out cmd/gwatch-agent/rsrc
          if ! git diff --quiet -- '*.syso'; then
            echo "::error::the committed .syso files do not match scripts/installer/assets/gwatch.ico — run 'make rsrc' and commit the result"
            git diff --stat -- '*.syso'
            exit 1
          fi

      # The web UI is embedded with //go:embed, so a syntax error in an asset
      # is invisible to the Go compiler and only shows up as a blank page.
      - name: Web assets
        run: |
          status=0
          while IFS= read -r f; do
            if ! node --check "$f"; then echo "::error file=$f::JavaScript syntax error"; status=1; fi
          done < <(find web -name '*.js' -type f | sort)
          for f in web/index.html web/app.js web/app.css web/api.js web/components.js web/logo.svg; do
            if [ ! -s "$f" ]; then echo "::error::missing or empty web asset: $f"; status=1; fi
          done
          if [ $status -ne 0 ]; then exit $status; fi
          # The tests themselves live outside web/ (tests/web/), not because
          # they belong to a different feature but so //go:embed web never
          # picks them up and ships them inside gwatch.exe — see tests/web/.
          npm ci
          npm test

      # install.ps1 / uninstall.ps1 are how GWatch gets onto a Windows machine.
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem -Path scripts -Filter *.ps1 -Recurse) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              $failed = $true
              foreach ($e in $errors) { Write-Host "::error file=$($file.FullName)::$($e.Message)" }
            } else { Write-Host "ok $($file.Name)" }
          }
          if ($failed) { exit 1 }

      # ISCC only runs on Windows and stops at the first error, so a mistake in
      # a .iss costs a full CI round trip to find. This catches the cheap ones
      # first, plus the one a clean compile will not catch at all: a non-ASCII
      # character in a BOM-less .iss reaches the wizard as mojibake.
      - name: Inno Setup scripts lint
        shell: pwsh
        run: pwsh -File scripts/installer/lint.ps1

      - name: Build Windows executable
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=ci-${GITHUB_SHA::7}" -o dist/gwatch-windows-amd64.exe .
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: gwatch-windows-amd64
          path: dist/gwatch-windows-amd64.exe
          if-no-files-found: error

      # Compiles both Windows setup programs from the exes just built, so every
      # push/PR exercises scripts/installer/*.iss the same way the release job
      # does. See scripts/installer/README.md.
      - name: Build the agent executable
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=ci-${GITHUB_SHA::7}" -o dist/gwatch-agent-windows-amd64.exe ./cmd/gwatch-agent
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
        shell: pwsh
      # Runs under pwsh: Git Bash rewrites /D... arguments as Windows paths
      # (MSYS path conversion), which ISCC then reads as extra script names.
      - name: Build Windows installers
        shell: pwsh
        run: |
          $version = "0.0.0-ci-" + $env:GITHUB_SHA.Substring(0, 7)
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          foreach ($pair in @(
              @{ Script = "scripts\installer\gwatch.iss";       Exe = "dist\gwatch-windows-amd64.exe" },
              @{ Script = "scripts\installer\gwatch-agent.iss"; Exe = "dist\gwatch-agent-windows-amd64.exe" })) {
            $exe = Join-Path $PWD $pair.Exe
            & $iscc "/DAppVersion=$version" "/DExePath=$exe" $pair.Script
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Get-ChildItem scripts\installer\Output
      - uses: actions/upload-artifact@v4
        with:
          name: gwatch-windows-installer
          path: |
            scripts/installer/Output/gwatch-setup-*.exe
            scripts/installer/Output/gwatch-agent-setup-*.exe
          if-no-files-found: error

  # GWatch installs as a service only on Windows, but it builds and runs as a
  # plain console process anywhere, and internal/sysmetrics has a real
  # linux_amd64/linux_arm64 build-tagged file (collect_linux.go) that the
  # Windows job never compiles. This job is the one that does.
  linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    # The store can keep GWatch's data on a PostgreSQL or MySQL server instead
    # of the SQLite file (docs/DATABASE.md). Two service containers let the
    # suites that open a database run against each one below, after the
    # SQLite pass; a dialect bug shows up here rather than on somebody's
    # server. The test user needs CREATE SCHEMA / CREATE DATABASE, since every
    # test works in a schema of its own, so it is the superuser on both.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gwatch
          POSTGRES_PASSWORD: gwatch
          POSTGRES_DB: gwatch
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gwatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: gwatch
          MYSQL_DATABASE: gwatch
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pgwatch --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: gofmt, go vet, go build, go test
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd:"; echo "$unformatted"; gofmt -d .; exit 1
          fi
          go vet ./...
          go build ./...
          go test -count=1 ./...

      # The race detector is worth the extra time on the packages most likely
      # to have one: the scheduler, the API server, the store's queued writer
      # and the agent-facing hardware-monitoring code.
      - name: Race tests
        run: go test -race -count=1 ./internal/engine/... ./internal/api/... ./internal/store/... ./internal/hostmon/...

      # The same suites on the two server backends. The store's own tests are
      # the point; backup covers the SQLite-to-server copy behind
      # "gwatch migrate-db", and api the Settings › Database routes.
      - name: Store under PostgreSQL
        env:
          GWATCH_TEST_DB: postgres
          GWATCH_TEST_PG_DSN: postgres://gwatch:gwatch@localhost:5432/gwatch?sslmode=disable
        run: go test -count=1 ./internal/store/... ./internal/backup/... ./internal/api/...

      - name: Store under MySQL
        env:
          GWATCH_TEST_DB: mysql
          GWATCH_TEST_MYSQL_DSN: root:gwatch@tcp(127.0.0.1:3306)/gwatch
        run: go test -count=1 ./internal/store/... ./internal/backup/... ./internal/api/...

      # The SQLite driver is picked by build tag (internal/store/driver.go).
      # Everything above ran on the default, modernc.org/sqlite; these two
      # steps compile the whole tree with each alternative and re-run the
      # packages that open a database, so a change to the store keeps working
      # under all three. The cgo one needs a C compiler, which ubuntu-latest
      # has; it is a from-source option only and never a release build.
      - name: Store under ncruces/go-sqlite3
        run: |
          go vet -tags sqlite_ncruces ./...
          go test -tags sqlite_ncruces -count=1 ./internal/store/... ./internal/api/... ./internal/engine/... ./internal/backup/...

      - name: Store under mattn/go-sqlite3 (cgo)
        env:
          CGO_ENABLED: '1'
        run: |
          go vet -tags sqlite_cgo ./...
          go test -tags sqlite_cgo -count=1 ./internal/store/... ./internal/api/... ./internal/engine/... ./internal/backup/...

      # The MCP companion is its own module (see the Windows job's comment on
      # the same step) and gets the same treatment here.
      - name: MCP companion — gofmt, go vet, go build, go test
        working-directory: mcp
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files in mcp/ are not gofmt'd:"; echo "$unformatted"; gofmt -d .; exit 1
          fi
          go vet ./...
          go build ./...
          go test -count=1 ./...

      # govulncheck is pinned so a release of it cannot change what the job
      # does on its own; bump the pin when a newer one is wanted, and check
      # its go.mod still builds under the Go version above with
      # GOTOOLCHAIN=local.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: govulncheck
        run: govulncheck ./...
      - name: govulncheck (mcp)
        working-directory: mcp
        run: govulncheck ./...

      # The browser accessibility suite (tests/e2e/): Playwright drives
      # Chromium through every page of web/ in mock mode with an axe-core
      # scan, and walks the Help page's keyboard contract. It lives here
      # rather than on the Windows job, which is already the longest, and
      # like tests/web/ it sits outside web/ so //go:embed never ships it.
      - name: Web accessibility (Playwright + axe)
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e

  # Exercises internal/sysmetrics/collect_darwin.go, the other platform-tagged
  # file the Windows job cannot reach. Deliberately lean: no race tests, no
  # govulncheck (the Linux job already runs both against the same source).
  macos:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - name: go vet, go test
        run: |
          go vet ./...
          go test -count=1 ./...

  # The container image (docs/DOCKER.md). Build-only on every push and PR,
  # for this runner's platform, then two checks that catch what a successful
  # build alone cannot: that the binary in the image runs and carries the
  # version it was given, and that a fresh container with an empty /data
  # actually comes up and answers /api/health — which exercises the non-root
  # user, the volume's ownership, the GWATCH_* defaults and the HEALTHCHECK's
  # assumptions. Publishing is docker-publish, further down.
  docker:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          docker build --build-arg VERSION="ci-${GITHUB_SHA::7}" -t gwatch:ci .
          docker image inspect gwatch:ci --format 'size {{.Size}} bytes, user {{.Config.User}}, labels {{json .Config.Labels}}'
      - name: gwatch version
        run: |
          out="$(docker run --rm gwatch:ci version)"
          echo "$out"
          case "$out" in
            "gwatch ci-${GITHUB_SHA::7} ("*) ;;
            *) echo "::error::expected 'gwatch ci-${GITHUB_SHA::7} (...)', got '$out'"; exit 1 ;;
          esac
      # /data as a tmpfs owned by the image's user, so this is the same first
      # start a real volume gets — nothing on the runner's disk to clean up.
      - name: Starts and answers /api/health
        run: |
          docker run -d --name gwatch-smoke -p 127.0.0.1:7230:7230 \
            --tmpfs /data:rw,uid=7230,gid=7230 gwatch:ci
          code=0
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7230/api/health || true)"
            [ "$code" = "200" ] && break
            sleep 1
          done
          echo "--- container log ---"; docker logs gwatch-smoke; echo "---------------------"
          if [ "$code" != "200" ]; then
            echo "::error::/api/health answered '$code' after 30s"
            docker rm -f gwatch-smoke
            exit 1
          fi
          curl -s http://127.0.0.1:7230/api/health; echo
          docker stop gwatch-smoke
          docker rm gwatch-smoke

  # Tagging v1.2.3 publishes a GitHub release with the binaries the in-app
  # updater (Settings › Updates) looks for: gwatch-<os>-<arch>[.exe] plus a
  # .sha256 checksum and an ed25519 .sig signature next to each. The updater
  # refuses anything it cannot verify against the key pinned in
  # internal/update/release_keys.txt, so this job signs with the
  # GWATCH_SIGNING_KEY secret and checks the two agree before publishing
  # (see docs/RELEASING.md).
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci, linux, macos]
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      # The VERSION file is what local builds and the installer read, and the
      # tag is what the release is named after. If they disagree, a release
      # ships binaries whose own --version output contradicts the download they
      # came from, so stop before anything is built.
      - name: Tag matches VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d ' \t\r\n' < VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the VERSION file (${file}). Update VERSION, commit, and re-tag."
            exit 1
          fi
          echo "releasing ${file}"

      # Fail before anything is built if the release could not be signed, or
      # could be signed with a key the shipped binaries would not trust.
      - name: Signing key
        env:
          GWATCH_SIGNING_KEY: ${{ secrets.GWATCH_SIGNING_KEY }}
        run: |
          if [ -z "$GWATCH_SIGNING_KEY" ]; then
            echo "::error::set the GWATCH_SIGNING_KEY secret (base64 ed25519 seed) — releases must be signed, see docs/RELEASING.md"
            exit 1
          fi
          pub="$(go run ./cmd/gwatch-sign pubkey)"
          echo "signing with $pub"
          if ! grep -v '^[[:space:]]*#' internal/update/release_keys.txt | grep -qF "$pub"; then
            echo "::error::the GWATCH_SIGNING_KEY secret's public key ($pub) is not listed in internal/update/release_keys.txt, so the released binaries would reject their own updates. Add the line and tag again."
            exit 1
          fi

      - name: Cross-compile
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/arm64 darwin/amd64; do
            goos="${target%/*}"; goarch="${target#*/}"
            out="dist/gwatch-${goos}-${goarch}"; [ "$goos" = "windows" ] && out="$out.exe"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "$out" .
            sha256sum "$out" | sed 's#dist/##' > "$out.sha256"
          done
          ls -lh dist

      # The MCP companion ships beside the core binaries but versions on its
      # own, so its version string comes from mcp/VERSION rather than the tag.
      # The gwatch-mcp-<goos>-<goarch>[.exe] naming puts it inside the
      # dist/gwatch-* glob the signing step uses, so it is signed and
      # checksummed like everything else. It stays invisible to the in-app
      # updater: internal/update.pickAsset matches the exact names
      # gwatch-<goos>-<goarch>[.exe], and "gwatch-mcp-linux-amd64" is not one
      # of them.
      - name: Cross-compile the MCP companion
        working-directory: mcp
        run: |
          version="$(tr -d ' \t\r\n' < VERSION)"
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/arm64 darwin/amd64; do
            goos="${target%/*}"; goarch="${target#*/}"
            out="../dist/gwatch-mcp-${goos}-${goarch}"; [ "$goos" = "windows" ] && out="$out.exe"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "$out" ./cmd/gwatch-mcp
            sha256sum "$out" | sed 's#../dist/##' > "$out.sha256"
          done
          ls -lh ../dist

      # The hardware agent is NOT built here. It versions and releases on its
      # own (agent-v*, the agent-release job below), because a machine running
      # an agent is rarely one anyone logs into: the agent updates itself from
      # its own releases, and tying it to this tag would mean a GWatch release
      # every time the agent needed a fix. See docs/RELEASING.md#releasing-the-agent.

      # Sign every binary, then verify the signatures with the keys pinned into
      # this checkout — exactly what the updater does on the user's machine.
      - name: Sign release assets
        env:
          GWATCH_SIGNING_KEY: ${{ secrets.GWATCH_SIGNING_KEY }}
        run: |
          go run ./cmd/gwatch-sign sign dist/gwatch-*
          go run ./cmd/gwatch-sign verify dist/gwatch-*
          ls -lh dist

      # Windows setup program built from the windows/amd64 binary above. Not
      # part of the signed self-update chain (see docs/RELEASING.md#the-installer-artefact):
      # pickAsset only matches gwatch-<os>-<arch>[.exe], so this asset is
      # invisible to the in-app updater by design, and it isn't
      # Authenticode-signed.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
        shell: pwsh
      - name: Build Windows installers
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $exe = Join-Path $PWD "dist\gwatch-windows-amd64.exe"
          & $iscc "/DAppVersion=$version" "/DExePath=$exe" "scripts\installer\gwatch.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item scripts\installer\Output\gwatch-setup-*.exe dist\
          Get-ChildItem dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # The hardware agent's own release, cut by tagging agent-v<version>.
  #
  # It is separate from the core release for one reason: the agent runs on
  # machines nobody logs into, so it updates itself, and a thing that updates
  # itself needs releases it can be pointed at that carry nothing else. An
  # agent asks for agent-v* tags and gwatch-agent-<goos>-<goarch> assets, and a
  # GWatch installation asks for v* and gwatch-<goos>-<goarch>; neither can be
  # handed the other's build (internal/update, TestReleaseFamiliesStayApart).
  #
  # Assets are signed by the same key and verified the same way as the core
  # release — the agent will not install anything it cannot verify against the
  # keys pinned into it, so an unsigned agent release is an agent release
  # nobody can take.
  agent-release:
    name: Release the agent
    if: startsWith(github.ref, 'refs/tags/agent-v')
    needs: [ci, linux, macos]
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      # An agent whose --version disagrees with the release it came from is an
      # agent that will either re-install the same version forever or refuse a
      # real one, so the two must agree before anything is built.
      - name: Tag matches cmd/gwatch-agent/VERSION
        run: |
          tag="${GITHUB_REF_NAME#agent-v}"
          file="$(tr -d ' \t\r\n' < cmd/gwatch-agent/VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match cmd/gwatch-agent/VERSION (${file}). Update the file, commit, and re-tag."
            exit 1
          fi
          echo "releasing agent ${file}"

      - name: Signing key
        env:
          GWATCH_SIGNING_KEY: ${{ secrets.GWATCH_SIGNING_KEY }}
        run: |
          if [ -z "$GWATCH_SIGNING_KEY" ]; then
            echo "::error::set the GWATCH_SIGNING_KEY secret (base64 ed25519 seed) — agent releases must be signed or no agent will install them, see docs/RELEASING.md"
            exit 1
          fi
          pub="$(go run ./cmd/gwatch-sign pubkey)"
          echo "signing with $pub"
          if ! grep -v '^[[:space:]]*#' internal/update/release_keys.txt | grep -qF "$pub"; then
            echo "::error::the GWATCH_SIGNING_KEY secret's public key ($pub) is not listed in internal/update/release_keys.txt, so released agents would reject their own updates. Add the line and tag again."
            exit 1
          fi

      # More platforms than the server is built for: linux/arm covers the
      # Raspberry Pi class of machine people actually put agents on.
      - name: Cross-compile the agent
        run: |
          version="${GITHUB_REF_NAME#agent-v}"
          mkdir -p dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 linux/arm darwin/arm64 darwin/amd64; do
            goos="${target%/*}"; goarch="${target#*/}"
            out="dist/gwatch-agent-${goos}-${goarch}"; [ "$goos" = "windows" ] && out="$out.exe"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "$out" ./cmd/gwatch-agent
            sha256sum "$out" | sed 's#dist/##' > "$out.sha256"
          done
          ls -lh dist

      # Signed and then verified with the keys pinned into this checkout —
      # exactly what an agent out on a machine somewhere will do before it
      # installs any of this.
      - name: Sign release assets
        env:
          GWATCH_SIGNING_KEY: ${{ secrets.GWATCH_SIGNING_KEY }}
        run: |
          go run ./cmd/gwatch-sign sign dist/gwatch-agent-*
          go run ./cmd/gwatch-sign verify dist/gwatch-agent-*
          ls -lh dist

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
        shell: pwsh
      - name: Build the agent installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^agent-v', ''
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $exe = Join-Path $PWD "dist\gwatch-agent-windows-amd64.exe"
          & $iscc "/DAppVersion=$version" "/DExePath=$exe" "scripts\installer\gwatch-agent.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item scripts\installer\Output\gwatch-agent-setup-*.exe dist\
          Get-ChildItem dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/gwatch-agent-*
          generate_release_notes: true
          name: Agent ${{ github.ref_name }}
          body: |
            The GWatch hardware agent, released on its own (see docs/RELEASING.md).

            Agents already installed and left on automatic updates will take
            this by themselves within a few hours. To install it now on a
            machine, run `gwatch-agent update` there.

  # The same v* tag also publishes the container image to GitHub's registry
  # (docs/DOCKER.md, docs/RELEASING.md#the-container-image). Separate from
  # `release` because it needs a Linux runner with buildx and QEMU for the
  # arm64 half, and because `packages: write` should belong to the one job
  # that pushes to the registry. It repeats the tag-matches-VERSION guard so
  # an image can never carry a version its tag disagrees with.
  docker-publish:
    name: Publish container image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci, linux, macos, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Lower-case on purpose: the repository is jxburros/GWatch, and registry
      # names must be lower-case, so github.repository cannot be used as-is.
      IMAGE: ghcr.io/jxburros/gwatch
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d ' \t\r\n' < VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the VERSION file (${file}). Update VERSION, commit, and re-tag."
            exit 1
          fi
          echo "publishing ${IMAGE}:${file}"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # v1.2.3 becomes the tags 1.2.3, 1.2 and latest. metadata-action strips
      # the leading v itself; the OCI labels it adds sit beside the ones the
      # Dockerfile sets.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A `mcp/v1.2.3` tag exists only so `go install .../mcp/cmd/gwatch-mcp@latest`
  # resolves — Go's nested-module resolution needs a tag prefixed with the
  # module's subdirectory (see docs/RELEASING.md#releasing-the-mcp-companion).
  # It does not publish a second GitHub release: the MCP companion's binaries
  # already ship inside the core `v*` release above (the "Cross-compile the
  # MCP companion" step), versioned from mcp/VERSION regardless of which core
  # tag triggered it. This job only guards against tagging a version that was
  # never committed to mcp/VERSION, and proves the module still builds.
  mcp-tag:
    name: MCP tag matches mcp/VERSION
    if: startsWith(github.ref, 'refs/tags/mcp/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - name: Tag matches mcp/VERSION
        run: |
          tag="${GITHUB_REF_NAME#mcp/v}"
          file="$(tr -d ' \t\r\n' < mcp/VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match mcp/VERSION (${file}). Update mcp/VERSION, commit, and re-tag."
            exit 1
          fi
          echo "mcp/${file} tag verified"
      - name: Build the MCP companion
        working-directory: mcp
        run: go build ./...
