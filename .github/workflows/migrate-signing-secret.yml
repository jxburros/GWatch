name: Migrate release signing secret
on:
  workflow_dispatch:
    inputs:
      environment_public_key:
        description: Public key returned by the release Environment secrets API
        required: true
        type: string
      environment_key_id:
        description: Matching destination Environment key id
        required: true
        type: string
permissions:
  contents: read
jobs:
  encrypt:
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify reviewed source
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.x'
          cache: false
      - name: Seal for the destination Environment
        env:
          GWATCH_SIGNING_KEY: ${{ secrets.GWATCH_SIGNING_KEY }}
          DESTINATION_PUBLIC_KEY: ${{ inputs.environment_public_key }}
          DESTINATION_KEY_ID: ${{ inputs.environment_key_id }}
        run: go run ./cmd/gwatch-seal-secret --public-key "$DESTINATION_PUBLIC_KEY" --key-id "$DESTINATION_KEY_ID" > signing-key-envelope.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signing-key-envelope
          path: signing-key-envelope.json
          retention-days: 1
          if-no-files-found: error
