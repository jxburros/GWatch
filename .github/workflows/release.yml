      with:
        ref: ${{ needs.plan.outputs.sha }}
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: winget-manifests
        path: dist/winget/manifests
    - name: Open the winget-pkgs pull request
      env:
        WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      shell: pwsh
      run: |
        if (-not $env:WINGET_TOKEN) { Write-Host "::notice::Winget publishing is not configured; manifests retained as artifacts."; exit 0 }
        Invoke-WebRequest -Uri https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe -OutFile wingetcreate.exe
        if ((Get-FileHash wingetcreate.exe -Algorithm SHA256).Hash -ne "24042bd37915805615e6cf969ac57c6439124c3fe85823327f5f3fb24bd9ffea") { throw "wingetcreate checksum mismatch" }
        .\wingetcreate.exe submit --prtitle "New version: GWatch.Agent version $env:AGENT_VERSION" --token $env:WINGET_TOKEN "dist\winget\manifests\GWatch.Agent\$env:AGENT_VERSION"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    env:
      RELEASE_TAG: ${{ fromJSON(needs.plan.outputs.apps)['gwatch-agent'].tag }}
      RELEASE_VERSION: ${{ fromJSON(needs.plan.outputs.apps)['gwatch-agent'].version }}
      RELEASE_SOURCE_SHA: ${{ needs.plan.outputs.sha }}
  docker-publish:
    name: Publish container image
    if: needs.plan.outputs.selected == 'true' && fromJSON(needs.plan.outputs.apps)['gwatch'].selected && !inputs.dry_run
    needs:
    - plan
    - publish-gwatch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/jxburros/gwatch
      RELEASE_TAG: ${{ fromJSON(needs.plan.outputs.apps)['gwatch'].tag }}
      RELEASE_VERSION: ${{ fromJSON(needs.plan.outputs.apps)['gwatch'].version }}
      RELEASE_SOURCE_SHA: ${{ needs.plan.outputs.sha }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ needs.plan.outputs.sha }}
    - name: Tag matches VERSION
      run: |
        tag="${RELEASE_TAG#v}"
        file="$(tr -d ' \t\r\n' < VERSION)"
        if [ "$tag" != "$file" ]; then
          echo "::error::tag ${RELEASE_TAG} does not match the VERSION file (${file}). Update VERSION, commit, and re-tag."
          exit 1
        fi
        echo "publishing ${IMAGE}:${file}"
    - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
      id: meta
      with:
        images: ${{ env.IMAGE }}
        tags: |-
          type=raw,value=${{ fromJSON(needs.plan.outputs.apps)['gwatch'].version }}
          type=raw,value=latest,enable=${{ inputs.channel == 'stable' }}
    - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      with:
        context: .
        platforms: linux/amd64,linux/arm64,linux/arm/v7
        push: true
        build-args: |
          VERSION=${{ steps.meta.outputs.version }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
  agent-docker-publish:
    name: Publish agent container image
    if: needs.plan.outputs.selected == 'true' && fromJSON(needs.plan.outputs.apps)['gwatch-agent'].selected && !inputs.dry_run
    needs:
    - plan
    - publish-gwatch-agent
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/jxburros/gwatch-agent
      RELEASE_TAG: ${{ fromJSON(needs.plan.outputs.apps)['gwatch-agent'].tag }}
      RELEASE_VERSION: ${{ fromJSON(needs.plan.outputs.apps)['gwatch-agent'].version }}
      RELEASE_SOURCE_SHA: ${{ needs.plan.outputs.sha }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ needs.plan.outputs.sha }}
    - name: Tag matches cmd/gwatch-agent/VERSION
      id: tag
      run: |
        tag="${RELEASE_TAG#agent-v}"
        file="$(tr -d ' \t\r\n' < cmd/gwatch-agent/VERSION)"
        if [ "$tag" != "$file" ]; then
          echo "::error::tag ${RELEASE_TAG} does not match cmd/gwatch-agent/VERSION (${file})."
          exit 1
        fi
        echo "version=$file" >> "$GITHUB_OUTPUT"
        echo "publishing ${IMAGE}:${file}"
    - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
      id: meta
      with:
        images: ${{ env.IMAGE }}
        tags: |-
          type=raw,value=${{ fromJSON(needs.plan.outputs.apps)['gwatch-agent'].version }}
          type=raw,value=latest,enable=${{ inputs.channel == 'stable' }}
    - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      with:
        context: .
        file: packaging/docker/Dockerfile.agent
        platforms: linux/amd64,linux/arm64,linux/arm/v7
        push: true
        build-args: |
          VERSION=${{ steps.tag.outputs.version }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=agent
        cache-to: type=gha,mode=max,scope=agent
env:
  GOTOOLCHAIN: local
