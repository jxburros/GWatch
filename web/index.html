<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GWatch</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    form { display: grid; gap: 0.75rem; max-width: 420px; }
    input, select, button { padding: 0.5rem; font-size: 1rem; }
    #result { margin-top: 1rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>GWatch Network Monitor</h1>
  <form id="check-form">
    <label for="type">
      Check Type
      <select id="type" name="type" required>
        <option value="ping">Ping</option>
        <option value="http">HTTP/S</option>
        <option value="dns">DNS</option>
      </select>
    </label>

    <label for="target">
      Target
      <input id="target" name="target" placeholder="example.com or https://example.com" required>
    </label>

    <label for="timeout">
      Timeout (seconds)
      <input id="timeout" name="timeout" type="number" min="1" value="5" required>
    </label>

    <button type="submit">Run Check</button>
  </form>

  <p id="status" role="status" aria-live="polite"></p>
  <pre id="result"></pre>

  <script>
    const form = document.getElementById('check-form');
    const status = document.getElementById('status');
    const result = document.getElementById('result');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      status.textContent = 'Running...';
      result.textContent = '';

      const payload = {
        type: document.getElementById('type').value,
        target: document.getElementById('target').value,
        timeoutSeconds: Number(document.getElementById('timeout').value)
      };

      try {
        const response = await fetch('/api/check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const contentType = response.headers.get('content-type') || '';
        const isJSON = contentType.includes('application/json');
        const data = isJSON ? await response.json() : { error: await response.text() };
        if (!response.ok) {
          status.textContent = `Request failed (${response.status})`;
          result.textContent = JSON.stringify({
            error: `Request failed (${response.status})`,
            response: data
          }, null, 2);
          return;
        }
        status.textContent = 'Check complete.';
        result.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        status.textContent = 'Request failed.';
        result.textContent = String(error);
      }
    });
  </script>
</body>
</html>
