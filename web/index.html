<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>GWatch</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
  <script>
    // Apply the remembered theme and accent before the first paint so the
    // page does not flash. Settings from the service override this on load.
    (function () {
      try {
        var t = localStorage.getItem('gw.theme') || 'dark';
        if (t === 'system') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
        var a = localStorage.getItem('gw.accent');  // default is #43c9c0, set in app.css
        if (a && /^#[0-9a-f]{6}$/i.test(a)) {
          var r = parseInt(a.slice(1, 3), 16), g = parseInt(a.slice(3, 5), 16), b = parseInt(a.slice(5, 7), 16);
          document.documentElement.style.setProperty('--accent-rgb', r + ', ' + g + ', ' + b);
        }
        if (localStorage.getItem('gw.railPinned') === '1') document.documentElement.classList.add('rail-pinned');
      } catch (e) { /* storage unavailable */ }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <div class="app" id="app">
    <aside class="rail" id="rail" aria-label="Primary">
      <a class="brand" href="#/dashboard" aria-label="GWatch home" title="Home">
        <img class="brand-logo" src="logo.svg" alt="" width="30" height="30">
        <span class="label brand-name">GWatch</span>
      </a>
      <nav class="nav" aria-label="Main navigation">
        <p class="nav-section" aria-hidden="true"><span class="label">Monitor</span><span class="rule"></span></p>
        <a class="nav-link" href="#/dashboard" data-nav="dashboard" title="Dashboard" style="--i:1"><span class="nav-icon" data-icon="grid"></span><span class="label">Dashboard</span></a>
        <a class="nav-link" href="#/nodes" data-nav="nodes" title="Nodes" style="--i:2"><span class="nav-icon" data-icon="server"></span><span class="label">Nodes</span></a>
        <a class="nav-link" href="#/charts" data-nav="charts" title="Charts" style="--i:3"><span class="nav-icon" data-icon="chart"></span><span class="label">Charts</span></a>
        <a class="nav-link" href="#/incidents" data-nav="incidents" title="Incidents" style="--i:4"><span class="nav-icon" data-icon="activity"></span><span class="label">Incidents</span></a>
        <p class="nav-section" aria-hidden="true"><span class="label">System</span><span class="rule"></span></p>
        <a class="nav-link" href="#/audit" data-nav="audit" title="Audit" style="--i:5"><span class="nav-icon" data-icon="audit"></span><span class="label">Audit</span></a>
        <a class="nav-link" href="#/settings" data-nav="settings" title="Settings" style="--i:6"><span class="nav-icon" data-icon="settings"></span><span class="label">Settings</span></a>
      </nav>
      <div class="rail-footer">
        <div class="account" id="account" hidden>
          <span class="nav-icon" data-icon="user"></span>
          <span class="label account-label">
            <b class="account-name"></b>
            <span class="account-role"></span>
          </span>
        </div>
        <button class="nav-link nav-link-secondary" id="sign-out" type="button" hidden title="Sign out"><span class="nav-icon" data-icon="logout"></span><span class="label">Sign out</span></button>
        <a class="nav-link nav-link-secondary" href="#/wallboard" data-nav="wallboard" title="Open wallboard" style="--i:7"><span class="nav-icon" data-icon="monitor"></span><span class="label">Wallboard</span></a>
        <a class="nav-link service-health" href="#/settings/health" id="service-health" aria-live="polite" title="Service health">
          <span class="nav-icon"><span class="orb orb-sm health-dot" aria-hidden="true"></span></span>
          <span class="label health-text">Checking service…</span>
        </a>
        <button class="nav-link rail-pin" id="rail-pin" type="button" aria-pressed="false" title="Keep the sidebar open"><span class="nav-icon" data-icon="pin"></span><span class="label">Pin sidebar</span></button>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <div class="topbar-title">
            <h1 id="page-title">Dashboard</h1>
            <p class="topbar-subtitle" id="page-subtitle" hidden></p>
          </div>
          <div class="status-dots" id="status-dots" aria-label="Attention summary" aria-live="polite"></div>
        </div>
        <div class="topbar-right">
          <div class="topbar-actions" id="page-actions"></div>
        </div>
      </header>
      <div class="api-banner" id="api-banner" role="alert" hidden>
        <span class="api-banner-icon" data-icon="alert"></span>
        <span id="api-banner-text">The GWatch service is not responding — is it running?</span>
        <button class="btn btn-sm" id="api-banner-retry" type="button">Retry</button>
      </div>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite" aria-relevant="additions"></div>
  <div id="modals"></div>
  <script>
    // The in-browser mock backend is only loaded when the page is opened with ?mock=1.
    if (/(^|[?&])mock=1(&|$)/.test(location.search)) {
      const s = document.createElement('script');
      s.type = 'module';
      s.src = 'mock.js';
      s.onload = () => import('./app.js');
      document.head.appendChild(s);
    } else {
      import('./app.js');
    }
  </script>
</body>
</html>
